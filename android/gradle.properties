org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Offline mode configuration
# Uncomment the line below to enable permanent offline mode (requires all dependencies to be cached)
# org.gradle.offline=true

# Repository caching and offline support
# These settings help Gradle use cached dependencies when offline
# Note: Configuration cache is disabled due to compatibility issues with Flutter/Android Gradle Plugin
# org.gradle.configuration-cache=true
# org.gradle.unsafe.configuration-cache=true

# Java 17 configuration for Gradle 8.7 compatibility
# Note: You need to install Java 17 and set JAVA_HOME environment variable
# Download from: https://adoptium.net/temurin/releases/?version=17
# org.gradle.java.home=C:\\Program Files\\Java\\jdk-17

# Use the unbundled version of MLKit Barcode-scanning to reduce app size.
# Note: This requires Google Play Services to download the library on first use.
# If your app will be published on stores other than Google Play (e.g., Cafe Bazaar),
# consider using the bundled version to avoid dependency on Google Play Services.
dev.steenbakker.mobile_scanner.useUnbundled=true
